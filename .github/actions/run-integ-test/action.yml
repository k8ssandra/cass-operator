# Download docker images
# Load docker images
name: run-integration-test
description: "Run integration test"
inputs:
  integration_test:
    description: "M_INTEG_DIR value"
    required: true
  serverVersion:
    description: "Override server version used in the test file"
    required: false
  serverImage:
    description: "Override server image used in the test file"
    required: false
  networking:
    description: "Set networking mode for kind cluster (default: ipv4)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Free diskspace by removing unused packages
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: false
    # The runners already have the latest versions of tools, no need to reinstall them
    - name: Link tools
      shell: bash
      run: |
        mkdir bin
        ln -s /usr/local/bin/kustomize bin/kustomize
    - name: Create kind cluster
      id: cluster
      shell: bash
      run: |
        hack/cluster.sh ${{ inputs.networking }}
    - name: Collect cluster creation diagnostics
      if: ${{ failure() && steps.cluster.outcome == 'failure' }}
      shell: bash
      run: |
        diagnostics=build/kubectl_dump/cluster-creation
        mkdir -p "$diagnostics"
        # Collect independently: an exited node or missing tool must not hide
        # the other diagnostics or replace the original creation failure.
        {
          kind version
          docker version
          docker info
          uname -a
          free -h
          df -h
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          ip address
          ip route
          ip -6 route
        } > "$diagnostics/host.txt" 2>&1 || true
        docker ps -a > "$diagnostics/containers.txt" 2>&1 || true
        docker network inspect kind > "$diagnostics/network.json" 2>&1 || true
        sudo dmesg --ctime > "$diagnostics/dmesg.txt" 2>&1 || true
        for node in $(docker ps -a --filter label=io.x-k8s.kind.cluster=kind --format '{{.Names}}'); do
          docker logs --timestamps "$node" > "$diagnostics/$node.log" 2>&1 || true
          docker inspect "$node" > "$diagnostics/$node-inspect.json" 2>&1 || true
          docker exec "$node" journalctl --no-pager -b > "$diagnostics/$node-journal.txt" 2>&1 || true
          docker exec "$node" sh -c 'ip address; ip route; ip -6 route; cat /etc/resolv.conf; getent ahostsv4 host.docker.internal' \
            > "$diagnostics/$node-network.txt" 2>&1 || true
        done
        kind export logs "$diagnostics/kind" --name kind > "$diagnostics/export.log" 2>&1 || true
    - name: Configure registry proxies for IPv6 tests
      if: ${{ inputs.networking == 'ipv6' }}
      shell: bash
      run: |
        # Only the caches have IPv4 upstream access. Nodes reach them over IPv6.
        # Keep cluster.sh's writable local registry separate from these CI caches.
        for registry in localhost:5001 quay.io docker.io; do
          case "$registry" in
            localhost:5001) cache_name=kind-registry-ghcr; upstream=https://ghcr.io ;;
            quay.io) cache_name=kind-registry-quay; upstream=https://quay.io ;;
            docker.io) cache_name=kind-registry-docker; upstream=https://registry-1.docker.io ;;
          esac
          docker run -d --restart=always --network bridge --name "$cache_name" \
            -e "REGISTRY_PROXY_REMOTEURL=$upstream" registry:3
          docker network connect kind "$cache_name"
          for node in $(kind get nodes); do
            registry_dir="/etc/containerd/certs.d/$registry"
            docker exec "$node" mkdir -p "$registry_dir"
            # Set server to prevent direct upstream fallback.
            printf 'server = "http://%s:5000"\n' "$cache_name" |
              docker exec -i "$node" cp /dev/stdin "$registry_dir/hosts.toml"
          done
        done
    - name: Install gatekeeper rules
      if: ${{ !env.SKIP_GATEKEEPER }}
      shell: bash
      run: |
        hack/gatekeeper.sh
    - name: Download cass-operator image
      uses: actions/download-artifact@v8
      with:
        name: cass-operator
        path: /tmp
    - name: Download system-logger image
      uses: actions/download-artifact@v8
      with:
        name: system-logger
        path: /tmp
    - name: Load Docker images
      shell: bash
      id: load
      run: |
        echo "operator_img=$(docker load --input /tmp/k8ssandra-cass-operator.tar | cut -f 3 -d' ')" >> $GITHUB_OUTPUT
        echo "logger_img=$(docker load --input /tmp/k8ssandra-system-logger.tar | cut -f 3 -d' ')" >> $GITHUB_OUTPUT
    - name: Load image on the nodes of the cluster
      shell: bash
      run: |
        kind load docker-image --name=kind ${{ steps.load.outputs.operator_img }}
        kind load docker-image --name=kind ${{ steps.load.outputs.logger_img }}
    - name: Use GHCR pull-through cache for IPv6 tests
      if: ${{ inputs.networking == 'ipv6' }}
      shell: bash
      env:
        LOGGER_IMAGE: ${{ steps.load.outputs.logger_img }}
      run: |
        yq eval -i '.overrides.registry = "localhost:5001"' config/imageconfig/image_config.yaml
        # The registry override also applies to the locally built logger. Load
        # the same image under that name so it never needs to exist in GHCR.
        proxy_logger="localhost:5001/${LOGGER_IMAGE#docker.io/}"
        docker tag "$LOGGER_IMAGE" "$proxy_logger"
        kind load docker-image --name=kind "$proxy_logger"
    - name: Run integration test ( ${{ inputs.integration_test }} )
      shell: bash
      run: |
        IMG=${{ steps.load.outputs.operator_img }} make integ-test
