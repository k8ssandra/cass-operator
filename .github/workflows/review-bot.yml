# review-bot with an ACP agent (bob) and GITHUB_TOKEN: an example for the
# cass-operator pilot (R-2). The reference workflow is review-bot.yml; this
# one differs where the pilot needs it:
#
# - Both roles run on bob over ACP (acp/bob). bob is @ibm/bob, pinned in the
#   agent directory's package.json and lockfile and installed by the setup
#   job (no secret, lifecycle scripts off), not by bob's install script.
#   agent-dir/ next to this file is the agent directory to copy.
# - Posts as github-actions[bot] with the job's GITHUB_TOKEN; no GitHub App.
# - No CI wait (C-9): no workflow_run, status or schedule triggers.
# - Prototype: AGENTS.md, REVIEW.md and the guidelines come from the
#   review-process repository (REVIEW_BOT_KNOWLEDGE), not the base branch.
# - The action image is pinned by digest in every step (image:).
# - The review step's limit is 15 minutes. No spend cap is set: bob reports
#   no cost, so it would not be counted.
#
# Install: README.md next to this file.
#
# Jobs: gate (no secret), remove-label, prepare (no secret), setup (no
# secret, no token permissions; installs bob), review (BOB_API_KEY; reviews
# the prepared snapshot, never PR code). pull_request_target runs this file
# from the base branch; no job checks out or runs code from the PR.
name: review-bot

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

# One run per PR; a newer event cancels the one in flight (S-9). Label events
# for other labels get a group of their own so they cancel nothing.
concurrency:
  group: >-
    ${{ github.event.action == 'labeled'
        && github.event.label.name != (vars.REVIEW_BOT_AUTH_LABEL || 'ai-review/approved')
        && format('review-bot-ignored-{0}', github.run_id)
        || format('review-bot-{0}-{1}', vars.REVIEW_BOT_NAME || 'main', github.event.pull_request.number || inputs.pr) }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      (github.event_name == 'pull_request_target'
        && (github.event.action != 'labeled'
            || github.event.label.name == (vars.REVIEW_BOT_AUTH_LABEL || 'ai-review/approved')))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # the agent directory and .review/review-bot.yaml
      pull-requests: read
      checks: write # complete ai-review/<name> as skipped
    outputs:
      review: ${{ steps.gate.outputs.review }}
      remove-label: ${{ steps.gate.outputs.remove-label }}
      pr: ${{ steps.gate.outputs.pr }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      label: ${{ steps.gate.outputs.label }}
      waiting: ${{ steps.gate.outputs.waiting }}
    steps:
      - name: Authorize
        id: gate
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: gate
          token: ${{ github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
          knowledge: ${{ vars.REVIEW_BOT_KNOWLEDGE }}
          knowledge-guidelines: ${{ vars.REVIEW_BOT_KNOWLEDGE_GUIDELINES }}
          auth-label: ${{ vars.REVIEW_BOT_AUTH_LABEL }}
          auth-label-lifetime: ${{ vars.REVIEW_BOT_AUTH_LABEL_LIFETIME }}
          ci-require: "off"
          pr: ${{ inputs.pr }}
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
      - name: Hand the agent directory to the setup job (F-7)
        if: steps.gate.outputs.review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-agent-dir
          path: ${{ runner.temp }}/review-bot/agent/dir
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          overwrite: true
      - name: Upload gate run records (A-6, S-8)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-record-${{ vars.REVIEW_BOT_NAME || 'main' }}-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-bot/gate-out/records/*.json
          if-no-files-found: ignore
          retention-days: ${{ vars.REVIEW_BOT_RECORD_RETENTION_DAYS || '90' }}
      - name: Complete the check if the gate failed (S-9)
        if: failure() && github.event.pull_request.head.sha != ''
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: complete-check
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
          token: ${{ github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          outcome: failure

  remove-label:
    needs: gate
    if: needs.gate.outputs.remove-label == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write # remove the authorization label (Q-10 per-push lifetime)
    steps:
      - name: Remove the authorization label
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: remove-label
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
          token: ${{ github.token }}
          pr: ${{ needs.gate.outputs.pr }}
          auth-label: ${{ needs.gate.outputs.label }}

  prepare:
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_PREPARE_TIMEOUT_MINUTES || '20') }}
    permissions:
      contents: read # tarballs of the base and head commits
    steps:
      - name: Fetch trees and prepare the Go module cache
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: prepare
          token: ${{ github.token }}
          pr: ${{ needs.gate.outputs.pr }}
          base-sha: ${{ needs.gate.outputs.base-sha }}
          head-sha: ${{ needs.gate.outputs.head-sha }}
          # Go version: from the head's go.mod (the action's default).
          go-modules: ${{ vars.REVIEW_BOT_GO_MODULES || '.' }}
      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-snapshot
          path: ${{ runner.temp }}/review-bot/out/snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  setup:
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.REVIEW_BOT_SETUP_TIMEOUT_MINUTES || '15') }}
    # No token permissions and no secret (F-7, C-4): installs bob from the
    # agent directory's package.json and lockfile, lifecycle scripts off.
    permissions: {}
    steps:
      - name: Download the agent directory (fetched by the gate, never from the PR)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-agent-dir
          path: ${{ runner.temp }}/review-bot/agent/dir
      - name: Install what it lists (bob)
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: setup
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
      - name: Hand the installed agent directory to the review job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-agent-installed
          path: ${{ runner.temp }}/review-bot/agent-out/agent-dir.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  review:
    needs: [gate, prepare, setup]
    # Runs when prepare or setup failed too, so the check is completed (S-9).
    if: ${{ !cancelled() && needs.gate.outputs.review == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pull-requests: write # the review, thread replies, thread resolution
      checks: write # ai-review/<name>
    steps:
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-snapshot
          path: ${{ runner.temp }}/review-bot/in
      - name: Download the agent directory with bob (from the setup job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-bot-agent-installed
          path: ${{ runner.temp }}/review-bot/agent-in
      - name: Review
        id: review
        timeout-minutes: 15
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
        with:
          command: review
          token: ${{ github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          pr: ${{ needs.gate.outputs.pr }}
          agent-dir: ${{ vars.REVIEW_BOT_AGENT_DIR }}
          knowledge: ${{ vars.REVIEW_BOT_KNOWLEDGE }}
          acp-config: acp.json
          models: |
            reviewer=acp/bob
            verifier=acp/bob
          provider-env: BOB_API_KEY
          timeout-minutes: "15"
          waiting: ${{ needs.gate.outputs.waiting }}
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
      - name: Complete the check if the review did not (S-9)
        if: always()
        uses: burmanm/bobbie-bot/action@f35e648e5a527f6b20504f7d94d46f82b1f4a73e # review-bot f35e648
        with:
          command: complete-check
          image: ghcr.io/burmanm/review-bot-action@sha256:295829ba350c442ba224af3b7a0ec42a492f2f98cec6c7f29b00255114cade26
          token: ${{ github.token }}
          name: ${{ vars.REVIEW_BOT_NAME || 'main' }}
          head-sha: ${{ needs.gate.outputs.head-sha }}
          outcome: ${{ steps.review.outcome }}
      - name: Upload the run record (S-8, A-6, A-7)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-bot-record-${{ vars.REVIEW_BOT_NAME || 'main' }}-pr${{ needs.gate.outputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-bot/runs/*/*.json
          if-no-files-found: warn
          retention-days: ${{ vars.REVIEW_BOT_RECORD_RETENTION_DAYS || '90' }}
