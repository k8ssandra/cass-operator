name: Kind Integration Tests
on:
  push:
    branches:
      - master
      - '1.*.x'
  pull_request:
    branches: [master]
jobs:
  build_docker_images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set version value
        id: vars
        run: |
          echo "version=$(make version)" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          context: .
          push: false
          tags: k8ssandra/cass-operator:v${{ steps.vars.outputs.version }}
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/k8ssandra-cass-operator.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: logger.Dockerfile
          push: false
          tags: k8ssandra/system-logger:v${{ steps.vars.outputs.version }}
          outputs: type=docker,dest=/tmp/k8ssandra-system-logger.tar
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Upload cass-operator image
        uses: actions/upload-artifact@v7
        with:
          name: cass-operator
          path: /tmp/k8ssandra-cass-operator.tar
      - name: Upload system-logger image
        uses: actions/upload-artifact@v7
        with:
          name: system-logger
          path: /tmp/k8ssandra-system-logger.tar
  # The smoke test runs against every supported server version after merge. Pull requests only test
  # Cassandra 5.0.x: DSE and HCD images need a pull secret that pull requests from forks can't use.
  smoke_matrix:
    name: Select smoke test versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            include='[
              {"version": "5.0.9", "serverType": "", "gatekeeper": "true", "freeDisk": "false"}
            ]'
          else
            include='[
              {"version": "6.8.64", "serverType": "dse", "gatekeeper": "true", "freeDisk": "true"},
              {"version": "6.9.23", "serverType": "dse", "gatekeeper": "true", "freeDisk": "true"},
              {"version": "2.0.8", "serverType": "hcd", "gatekeeper": "true", "freeDisk": "true"},
              {"version": "4.0.21", "serverType": "", "gatekeeper": "false", "freeDisk": "false"},
              {"version": "4.1.12", "serverType": "", "gatekeeper": "true", "freeDisk": "false"},
              {"version": "5.0.9", "serverType": "", "gatekeeper": "true", "freeDisk": "false"}
            ]'
          fi
          echo "matrix=$(jq -c '{include: .}' <<< "$include")" >> "$GITHUB_OUTPUT"
  # Several suites run one after another on the same kind cluster to pay the cluster setup once.
  # Packs are ordered longest first, so that the long ones get a runner first.
  kind_int_tests:
    name: kind_int_tests (${{ matrix.pack.name }})
    needs: build_docker_images
    strategy:
      matrix:
        version:
          - "5.0.9"
        pack:
          - name: node_replace
            suites: node_replace
          - name: rolling_restart
            suites: rolling_restart
          - name: scale_up
            suites: scale_up mgmt_api_port_change webhook_validation
          - name: test_bad_config_and_fix
            suites: test_bad_config_and_fix additional_serviceoptions
          - name: decommission_dc
            suites: decommission_dc internode-encryption-generated config_fql
          - name: scale_up_stop_resume
            suites: scale_up_stop_resume config_change_condition
          - name: config_change
            suites: config_change cluster_wide_install
          - name: scale_down_unbalanced_racks
            suites: scale_down_unbalanced_racks rolling_restart_with_override add_racks
          - name: seed_selection
            suites: seed_selection config_secret additional_seeds
          - name: scale_down
            suites: scale_down canary_upgrade
          - name: scheduled_task
            suites: scheduled_task superuser-secret-provided podspec_simple superuser-secret-generated
          - name: host_network
            suites: host_network test_mtls_mgmt_api additional_volumes nodeport_service
          # Disabled suites:
          # - delete_node_terminated_container # This does not test any operator behavior
          # - terminate
          # - timeout_prestop_termination
          # - cdc_successful # OSS only
          # - delete_node_lost_readiness # DSE specific behavior
          # - no_infinite_reconcile # smoke_test_* should take care of this
          # - stop_resume
          # - multi_cluster_management
          # - scale_down_not_enough_space # Not enough stable test
          # - smoke_test_read_only_fs
          # - stop_resume_scale_up # Odd insufficient CPU issues in kind+GHA
      # let other tests continue to run
      # even if one fails
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      M_SERVER_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: ./.github/actions/run-integ-test
        with:
          integration_test: ${{ matrix.pack.suites }}
  # The operator upgrade test installs the previous release with gatekeeper, the new build must pass the same policies
  kind_upgrade_tests:
    needs: build_docker_images
    strategy:
      matrix:
        version:
          - "5.0.9"
        integration_test:
          - upgrade_operator
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      M_SERVER_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: ./.github/actions/run-integ-test
        with:
          integration_test: ${{ matrix.integration_test }}
          gatekeeper: "true"
  kind_smoke_tests:
    name: kind_smoke_tests (${{ matrix.version }})
    needs: [build_docker_images, smoke_matrix]
    strategy:
      matrix: ${{ fromJSON(needs.smoke_matrix.outputs.matrix) }}
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      M_SERVER_VERSION: ${{ matrix.version }}
      M_SERVER_TYPE: ${{ matrix.serverType }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - id: docker-login-icr
        if: ${{ matrix.serverType == 'hcd' || matrix.serverType == 'dse' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: iamapikey
          password: ${{ secrets.MC_ICR_IO_API_KEY }}
          registry: cp.icr.io
      - name: Configure cp.icr.io pull secret
        if: ${{ matrix.serverType == 'hcd' || matrix.serverType == 'dse' }}
        run: |
          yq eval -i '.defaults.pullSecrets = ["cass-operator-pull-secret"]' config/imageconfig/image_config.yaml
          echo "M_DOCKER_SERVER=cp.icr.io" >> "$GITHUB_ENV"
          echo "M_DOCKER_USERNAME=iamapikey" >> "$GITHUB_ENV"
          echo "M_DOCKER_PASSWORD=${{ secrets.MC_ICR_IO_API_KEY }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/run-integ-test
        with:
          integration_test: test_all_the_things
          gatekeeper: ${{ matrix.gatekeeper }}
          free_disk: ${{ matrix.freeDisk }}
          artifact_name: smoke_test-${{ matrix.version }}
  kind_smoke_ipv6_tests:
    needs: build_docker_images
    strategy:
      matrix:
        version:
          - "5.0.9"
        integration_test:
          - test_all_the_things
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      M_SERVER_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - uses: ./.github/actions/run-integ-test
        with:
          integration_test: ${{ matrix.integration_test }}
          networking: ipv6
          gatekeeper: "true"
          artifact_name: smoke_test_ipv6-${{ matrix.version }}
  kind_topolvm_tests:
    name: TopoLVM kind installation with volumeExpansion
    needs: build_docker_images
    strategy:
      matrix:
        version:
          - "5.0.9"
        integration_test:
          - pvc_expansion
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      M_INTEG_DIR: ${{ matrix.integration_test }}
      M_SERVER_VERSION: ${{ matrix.version }}
    steps:
      - name: Install necessary tools for LVM setup
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 xfsprogs thin-provisioning-tools
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          repository: topolvm/topolvm
          path: topolvm
          ref: topolvm-chart-v16.0.0
      - name: Create LVM from TopoLVM's example setup
        run: |
          cd topolvm/example
          mkdir -p build
          mkdir -p bin
          make start-lvmd
          make KIND=$(type -a -P kind) launch-kind
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Install TopoLVM controller
        run: |
          make cert-manager
          helm repo add topolvm https://topolvm.github.io/topolvm
          helm repo update
          kubectl create namespace topolvm-system
          kubectl label namespace topolvm-system topolvm.io/webhook=ignore
          kubectl label namespace kube-system topolvm.io/webhook=ignore
          helm install --namespace=topolvm-system topolvm topolvm/topolvm -f topolvm/example/values.yaml
          kubectl wait --for=condition=available --timeout=120s -n topolvm-system deployments/topolvm-controller
          kubectl wait --for=condition=ready --timeout=120s -n topolvm-system -l="app.kubernetes.io/component=controller,app.kubernetes.io/name=topolvm" pod
          kubectl wait --for=condition=ready --timeout=120s -n topolvm-system certificate/topolvm-mutatingwebhook || true
      - name: Link tools
        shell: bash
        run: |
          mkdir bin
          ln -s /usr/local/bin/kustomize bin/kustomize
      - name: Download cass-operator image
        uses: actions/download-artifact@v8
        with:
          name: cass-operator
          path: /tmp
      - name: Download system-logger image
        uses: actions/download-artifact@v8
        with:
          name: system-logger
          path: /tmp
      - name: Load Docker images
        shell: bash
        id: load
        run: |
          echo "operator_img=$(docker load --input /tmp/k8ssandra-cass-operator.tar | cut -f 3 -d' ')" >> $GITHUB_OUTPUT
          echo "logger_img=$(docker load --input /tmp/k8ssandra-system-logger.tar | cut -f 3 -d' ')" >> $GITHUB_OUTPUT
      - name: Load image on the nodes of the cluster
        shell: bash
        run: |
          kind load docker-image --name=topolvm-example ${{ steps.load.outputs.operator_img }}
          kind load docker-image --name=topolvm-example ${{ steps.load.outputs.logger_img }}
      - name: Load GHCR-tagged system-logger
        shell: bash
        env:
          LOGGER_IMAGE: ${{ steps.load.outputs.logger_img }}
        run: |
          ghcr_logger="ghcr.io/${LOGGER_IMAGE#docker.io/}"
          docker tag "$LOGGER_IMAGE" "$ghcr_logger"
          kind load docker-image --name=topolvm-example "$ghcr_logger"
      - name: Run integration test
        shell: bash
        run: |
          IMG=${{ steps.load.outputs.operator_img }} LOG_IMG=${{ steps.load.outputs.logger_img }} make integ-test
      - name: Archive k8s logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: k8s-logs-topolvm-test-${{ matrix.version }}
          path: ./build/kubectl_dump
      - name: Archive support bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: support-bundle-topolvm-test-${{ matrix.version }}
          path: ./build/kubectl_dump/**/support-bundle/**
          if-no-files-found: ignore
